name: Backend Tests

on:
  push:
    branches: [master]
    paths:
      - 'backend/onboarding/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/onboarding/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn -B -f backend/onboarding/pom.xml test
